<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creative Designer & Developer — Portfolio</title>
    <meta
      name="description"
      content="Creative Designer & Developer building immersive digital experiences."
    />

    <!-- Google Fonts: Outfit + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="hero-section">
      <!-- Background video -->
      <div class="video-container">
        <video
          id="heroVideo"
          class="hero-video"
          autoplay
          muted
          playsinline
          preload="auto"
        >
          <source
            src="https://strvid.nyc3.cdn.digitaloceanspaces.com/cloudinary/portfolio_hero_bg_zuhahj.webm"
            type="video/webm"
          />
        </video>
        <div class="video-overlay"></div>
      </div>

      <!-- Navigation -->
      <nav class="navbar">
        <a href="#" class="logo animate-fade-up" style="animation-delay: 0.1s">
          <i class="ph ph-cube-transparent" aria-hidden="true"></i>
          <span>STUDIO.NOVA</span>
        </a>

        <ul class="nav-links animate-fade-up" style="animation-delay: 0.2s">
          <li><a href="#" class="nav-link active">Home</a></li>
          <li><a href="#" class="nav-link">Work</a></li>
          <li><a href="#" class="nav-link">About</a></li>
          <li><a href="#" class="nav-link">Services</a></li>
          <li><a href="#" class="nav-link">Contact</a></li>
        </ul>

        <div class="nav-actions animate-fade-up" style="animation-delay: 0.3s">
          <a href="#" class="btn btn-outline">Let&rsquo;s Work Together</a>
        </div>

        <button class="mobile-menu-toggle" aria-label="Open menu">
          <i class="ph ph-list" aria-hidden="true"></i>
        </button>
      </nav>

      <!-- Hero center content -->
      <div class="hero-content">
        <div class="hero-text">
          <p class="greeting animate-fade-up" style="animation-delay: 0.1s">Hello, I&rsquo;m</p>
          <h1 class="main-title animate-fade-up" style="animation-delay: 0.2s">
            Creative Designer<br />&amp; Developer
          </h1>
          <p class="sub-title animate-fade-up" style="animation-delay: 0.3s">
            I build immersive digital experiences
          </p>
          <div class="cta-group animate-fade-up" style="animation-delay: 0.5s">
            <a href="#" class="btn btn-primary">View My Work</a>
            <a href="#" class="btn btn-outline">Download CV</a>
          </div>
        </div>
      </div>

      <!-- Hero footer -->
      <footer class="hero-footer">
        <div class="footer-left">
          <div class="availability-card glass animate-fade-up" style="animation-delay: 0.5s">
            <span class="pulse-dot" aria-hidden="true"></span>
            <div class="availability-text">
              <p class="availability-title">Available for Work</p>
              <p class="availability-sub">Open to freelance &amp; full-time roles</p>
            </div>
          </div>

          <div class="stats-group animate-fade-up" style="animation-delay: 0.6s">
            <div class="stat">
              <span class="stat-number">8+</span>
              <span class="stat-label">Years</span>
            </div>
            <span class="stat-line" aria-hidden="true"></span>
            <div class="stat">
              <span class="stat-number">120+</span>
              <span class="stat-label">Projects</span>
            </div>
            <span class="stat-line" aria-hidden="true"></span>
            <div class="stat">
              <span class="stat-number">40+</span>
              <span class="stat-label">Clients</span>
            </div>
          </div>

          <div class="social-links animate-fade-up" style="animation-delay: 0.7s">
            <a href="#" class="social-link" aria-label="GitHub"><i class="ph ph-github-logo"></i></a>
            <a href="#" class="social-link" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
            <a href="#" class="social-link" aria-label="X / Twitter"><i class="ph ph-x-logo"></i></a>
            <a href="#" class="social-link" aria-label="Dribbble"><i class="ph ph-dribbble-logo"></i></a>
          </div>
        </div>

        <div class="scroll-indicator" aria-hidden="true">
          <div class="mouse">
            <div class="wheel"></div>
          </div>
          <span class="scroll-text">Scroll</span>
        </div>
      </footer>
    </section>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="js/main.js"></script>
  </body>
</html>
